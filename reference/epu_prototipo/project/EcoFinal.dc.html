<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Eco · el recuerdo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B35B8}a:hover{color:#2B2536}
.blob{transition:transform .35s ease, opacity .35s ease;animation:in .5s ease-out backwards}
@keyframes in{from{opacity:0;transform:scale(.4)}}
@media(prefers-reduced-motion:reduce){.blob{transition:none;animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 66px 22px 28px; background: #EFECE4; color: #2B2536; font-family: Nunito, ui-rounded, 'Segoe UI', system-ui, sans-serif; line-height: 1.35; display: flex; flex-direction: column; gap: 18px">
  <a href="EcoNiveles.dc.html" style="position: absolute; top: 14px; left: 14px; height: 40px; box-sizing: border-box; padding: 0 14px 0 12px; border-radius: 999px; background: #fff; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: #2B2536; text-decoration: none; box-shadow: 0 2px 10px rgba(43,37,54,.1)"><span style="width: 8px; height: 8px; border-left: 2.5px solid #2B2536; border-bottom: 2.5px solid #2B2536; transform: translateX(2px) rotate(45deg)"></span>Atrás</a>
  <div style="text-align: center">
    <span style="font-size: 13px; font-weight: 800; color: #5a536b">{{ k }}</span>
    <h1 style="margin: 4px 0 0; font-size: 32px; font-weight: 900; letter-spacing: -.02em; line-height: 1.05">La descubrieron juntos</h1>
  </div>
  <div style="flex: 1; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div role="img" aria-label="{{ alt }}" style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 190px">
      <span aria-hidden="true" style="position: absolute; left: 10px; right: 10px; top: 35px; height: 120px; border-radius: 60px; background: radial-gradient(ellipse at center, rgba(34,160,84,.3) 0, rgba(34,160,84,.12) 50%, rgba(34,160,84,0) 75%)"></span>
      <sc-for list="{{ blobs }}" as="b" hint-placeholder-count="5"><span class="blob" style="position: relative; flex: none; width: {{ b.w }}px; height: {{ b.w }}px; margin: 0 -7px; border-radius: 50%; background: radial-gradient(circle, {{ b.c1 }} 0, {{ b.c1 }} 30%, {{ b.c0 }} 70%); transform: scale({{ b.s }}); animation-delay: {{ b.dl }}"></span></sc-for>
    </div>
    <div style="display: flex; gap: 16px; font-size: 12.5px; font-weight: 800; color: #4a445a">
      <span style="display: inline-flex; align-items: center; gap: 6px"><i style="width: 12px; height: 12px; border-radius: 50%; background: {{ lgC }}"></i>{{ lg }}</span>
      <sc-if value="{{ two }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px"><i style="width: 12px; height: 12px; border-radius: 50%; background: #E85E45"></i>Último trozo: el niño</span></sc-if>
    </div>
    <div style="text-align: center">
      <p style="margin: 0; font-size: 15px; font-weight: 800; color: #2B2536">{{ meta }}</p>
      <p style="margin: 6px auto 0; font-size: 15px; color: #4a445a; max-width: 300px">{{ sum }}</p>
    </div>
  </div>
  <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button onClick="{{ listen }}" style="min-height: 56px; padding: 10px 12px; font: inherit; font-size: 15px; font-weight: 800; line-height: 1.15; color: #2B2536; background: #fff; border: 1.5px solid rgba(43,37,54,.25); border-radius: 16px; cursor: pointer">Escuchar la melodía</button>
    <a href="{{ nxHref }}" data-melodia="{{ nx }}" onClick="{{ next }}" style="min-height: 56px; display: flex; align-items: center; justify-content: center; padding: 10px 12px; box-sizing: border-box; font-size: 15px; font-weight: 800; line-height: 1.15; color: #fff; text-decoration: none; background: #2B2536; border: 1.5px solid #2B2536; border-radius: 16px">{{ nxLab }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"melodia":{"editor":"enum","options":["1","2","3","4","5","6","7"],"default":"4"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  MEL = [
    { n: 'Madera', ins: 'Marimba', k: 'madera', fr: 'A3:2 C4:2|D4:2 E4:2|D4:1 C4:1 A3:2|C4:2 A3:2' },
    { n: 'Viento', ins: 'Flauta dulce', k: 'viento', fr: 'E4:2 G4:2|A4:3 G4:1|E4:2 D4:2|E4:4' },
    { n: 'Cuerda', ins: 'Guitarra', k: 'cuerda', fr: 'A3:1 E4:1 D4:2|C4:1 D4:1 E4:2|G4:2 E4:2|D4:1 C4:1 A3:2' },
    { n: 'Caña', ins: 'Clarinete', k: 'cana', fr: 'D4:2 E4:2|G4:3 E4:1|D4:2 C4:2|A3:2 C4:2|D4:4' },
    { n: 'Metal', ins: 'Handpan', k: 'metal', fr: 'A3:1 C4:1 E4:2|D4:1 E4:1 G4:2|A4:2 G4:2|E4:1 D4:1 C4:2|A3:4' },
    { n: 'Voces', ins: 'Coro', k: 'voces', fr: 'A3:4|C4:2 D4:2|E4:4|G4:2 E4:2|D4:2 C4:2|A3:4' },
    { n: 'Teclas', ins: 'Piano', k: 'teclas', fr: 'E4:1 G4:1 A4:2|G4:1 E4:1 D4:2|C4:1 D4:1 E4:2|G4:2 A4:2|E4:1 D4:1 C4:2|A3:4' }
  ];
  HZ = { A3: 220, C4: 261.63, D4: 293.66, E4: 329.63, G4: 392, A4: 440 };
  INST = {
    madera: { cut: 1800, a: .008, d: .9, p: [['sine', 1, 1, 1], ['sine', 4, .16, .22]] },
    viento: { cut: 1500, a: .09, d: 0, p: [['sine', 1, 1, 1], ['sine', 2, .12, 1], ['triangle', 1, .14, 1]] },
    cuerda: { cut: 1400, a: .006, d: 1.3, p: [['triangle', 1, 1, 1], ['sawtooth', 1, .1, .35]] },
    cana: { cut: 1000, a: .06, d: 0, p: [['square', 1, .3, 1], ['sine', 1, .6, 1]] },
    metal: { cut: 1900, a: .006, d: 2, p: [['sine', 1, 1, 1], ['sine', 2, .32, .7], ['sine', 3, .12, .45]] },
    voces: { cut: 800, a: .18, d: 0, p: [['triangle', 1, .55, 1], ['triangle', 1.006, .55, 1], ['sine', .5, .28, 1]] },
    teclas: { cut: 1600, a: .006, d: 1.6, p: [['sine', 1, 1, 1], ['triangle', 2, .18, .5], ['sine', 1.003, .4, 1]] }
  };
  GUIA = ['a', 'c', 'c', 'a', 'c', 'a', 'a'];
  T = [];
  state = { on: -1 };
  mel() {
    let saved = null; try { saved = sessionStorage.getItem('epuMelodia'); } catch (e) {}
    const id = Math.min(7, Math.max(1, parseInt(this.props.melodia ?? saved ?? '4', 10) || 4));
    const M = this.MEL[id - 1];
    return Object.assign({ id, frags: M.fr.split('|').map(f => f.split(' ').map(x => { const q = x.split(':'); return [this.HZ[q[0]], +q[1] * .5]; })) }, M);
  }
  note(ac, I, f, t, dur) {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = I.cut; lp.Q.value = .5; lp.connect(ac.destination);
    I.p.forEach(q => {
      const o = ac.createOscillator(), g = ac.createGain(), pk = .13 * q[2];
      o.type = q[0]; o.frequency.value = f * q[1];
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + I.a);
      let end;
      if (I.d) { end = t + I.a + I.d * q[3]; g.gain.exponentialRampToValueAtTime(.0001, end); }
      else { end = t + dur + .15; g.gain.setValueAtTime(pk, Math.max(t + I.a, t + dur - .12)); g.gain.exponentialRampToValueAtTime(.0001, end); }
      o.connect(g); g.connect(lp); o.start(t); o.stop(end + .05);
    });
  }
  play() {
    this.T.forEach(clearTimeout); this.T = [];
    const M = this.mel();
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) {
        this.ac = this.ac || new C(); this.ac.resume();
        const ac = this.ac, I = this.INST[M.k]; let t = ac.currentTime + .04;
        M.frags.forEach(fr => fr.forEach(q => { this.note(ac, I, q[0], t, q[1]); t += q[1]; }));
      }
    } catch (e) {}
    M.frags.forEach((_, i) => this.T.push(setTimeout(() => this.setState({ on: i }), i * 2000)));
    this.T.push(setTimeout(() => this.setState({ on: -1 }), M.frags.length * 2000));
  }
  componentWillUnmount() { this.T.forEach(clearTimeout); }
  renderVals() {
    const M = this.mel(), n = M.frags.length, on = this.state.on;
    const gA = this.GUIA[M.id - 1] === 'a', two = M.id === 7;
    return {
      k: 'Nivel ' + M.id + ' · ' + M.n,
      blobs: M.frags.map((_, i) => {
        const A = gA && !(two && i === n - 1);
        return { w: n > 5 ? 64 : 74, c1: A ? 'rgba(179,162,220,.95)' : 'rgba(232,94,69,.9)', c0: A ? 'rgba(179,162,220,0)' : 'rgba(232,94,69,0)', s: on === i ? 1.35 : 1, dl: (0.15 + i * 0.15).toFixed(2) + 's' };
      }),
      meta: M.ins + ' · ' + (n * 2) + ' segundos · ' + n + ' trozos',
      sum: (two ? 'Guió el adulto y el último trozo lo eligió el niño.' : gA ? 'Guió el adulto y el niño lo siguió.' : 'Guió el niño y el adulto lo siguió.') + ' Cada trozo sonó cuando acertaron juntos.',
      lg: gA ? 'Guió el adulto' : 'Guió el niño', lgC: gA ? '#B3A2DC' : '#E85E45', two,
      alt: 'Recuerdo de la melodía: ' + n + ' destellos de color, uno por cada trozo, del color de quien guió',
      nx: String(Math.min(7, M.id + 1)), nxHref: M.id < 7 ? 'EcoAntes.dc.html' : 'EcoNiveles.dc.html', nxLab: M.id < 7 ? 'Siguiente nivel' : 'Elegir nivel',
      next: () => { try { sessionStorage.setItem('epuMelodia', String(Math.min(7, M.id + 1))); sessionStorage.setItem('epuModo', 'eco'); } catch (e) {} },
      listen: () => this.play()
    };
  }
}
</script>
</body>
</html>
