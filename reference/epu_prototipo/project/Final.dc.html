<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Final · el recuerdo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B35B8}a:hover{color:#2B2536}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; background: #EFECE4; color: #2B2536; font-family: Nunito, ui-rounded, 'Segoe UI', system-ui, sans-serif; line-height: 1.35">
<a href="Home.dc.html" style="position: absolute; top: 14px; left: 14px; z-index: 3; height: 40px; box-sizing: border-box; padding: 0 14px 0 12px; border-radius: 999px; background: #fff; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: #2B2536; text-decoration: none; box-shadow: 0 2px 10px rgba(43,37,54,.1)"><span style="width: 8px; height: 8px; border-left: 2.5px solid #2B2536; border-bottom: 2.5px solid #2B2536; transform: translateX(2px) rotate(45deg)"></span>Atrás</a>
<div style="box-sizing: border-box; min-height: 844px; padding: 66px 22px 0; display: flex; flex-direction: column; gap: 16px">
  <div style="text-align: center">
    <h1 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -.02em; line-height: 1.05">Terminaron la canción.</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #4a445a; font-weight: 600">13 min · 52 % del tiempo en sincronía</p>
  </div>
  <div>
    <div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; color: #5a536b; margin-bottom: 8px"><span>La canción</span><span>7 de 7 partes</span></div>
    <div style="display: flex; gap: 4px"><i style="flex: 1; height: 10px; border-radius: 5px; background: #0D9488"></i><i style="flex: 1; height: 10px; border-radius: 5px; background: #0D9488"></i><i style="flex: 1; height: 10px; border-radius: 5px; background: #0D9488"></i><i style="flex: 1; height: 10px; border-radius: 5px; background: #0D9488"></i><i style="flex: 1; height: 10px; border-radius: 5px; background: #0D9488; box-shadow: 0 0 0 2px #EFECE4, 0 0 0 4px #0D9488"></i><i style="flex: 1; height: 10px; border-radius: 5px; background: #0D9488; box-shadow: 0 0 0 2px #EFECE4, 0 0 0 4px #0D9488"></i><i style="flex: 1; height: 10px; border-radius: 5px; background: #0D9488; box-shadow: 0 0 0 2px #EFECE4, 0 0 0 4px #0D9488"></i></div>
  </div>
  <div style="background: #fff; border-radius: 28px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <svg viewBox="-6.6 -6.6 13.2 13.2" role="img" aria-label="Recuerdo: recorridos del adulto y del niño" style="width: 100%; max-width: 400px; aspect-ratio: 1; display: block">
      <rect x="-6.6" y="-6.6" width="13.2" height="13.2" rx="1" fill="#fff"/>
      <line x1="-6" y1="-6" x2="-6" y2="6" stroke="#EFECE4" stroke-width=".05"/><line x1="-4" y1="-6" x2="-4" y2="6" stroke="#EFECE4" stroke-width=".05"/><line x1="-2" y1="-6" x2="-2" y2="6" stroke="#EFECE4" stroke-width=".05"/><line x1="0" y1="-6" x2="0" y2="6" stroke="#EFECE4" stroke-width=".05"/><line x1="2" y1="-6" x2="2" y2="6" stroke="#EFECE4" stroke-width=".05"/><line x1="4" y1="-6" x2="4" y2="6" stroke="#EFECE4" stroke-width=".05"/><line x1="6" y1="-6" x2="6" y2="6" stroke="#EFECE4" stroke-width=".05"/>
      <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#EFECE4" stroke-width=".05"/><line x1="-6" y1="-4" x2="6" y2="-4" stroke="#EFECE4" stroke-width=".05"/><line x1="-6" y1="-2" x2="6" y2="-2" stroke="#EFECE4" stroke-width=".05"/><line x1="-6" y1="0" x2="6" y2="0" stroke="#EFECE4" stroke-width=".05"/><line x1="-6" y1="2" x2="6" y2="2" stroke="#EFECE4" stroke-width=".05"/><line x1="-6" y1="4" x2="6" y2="4" stroke="#EFECE4" stroke-width=".05"/><line x1="-6" y1="6" x2="6" y2="6" stroke="#EFECE4" stroke-width=".05"/>
      <polyline points="{{ ptsA }}" fill="none" stroke="#9F8AD9" stroke-width=".16" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
      <polyline points="{{ ptsC }}" fill="none" stroke="#E85E45" stroke-width=".11" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
    </svg>
    <div style="display: flex; gap: 14px; font-size: 12.5px; font-weight: 800; color: #4a445a">
      <span style="display: inline-flex; align-items: center; gap: 6px"><i style="width: 18px; height: 4px; border-radius: 2px; background: #9F8AD9"></i>Adulto</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><i style="width: 18px; height: 4px; border-radius: 2px; background: #E85E45"></i>Niño</span>
    </div>
  </div>
  <p style="margin: 0; font-size: 14px; color: #4a445a; font-weight: 700; text-align: center">Esta vez el adulto siguió más al niño.</p>
  <div style="margin: auto -22px 0; position: sticky; bottom: 0; z-index: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px 22px 18px; background: #fff; box-shadow: 0 -1px 0 rgba(43,37,54,.1)">
    <button onClick="{{ listen }}" style="min-height: 56px; padding: 10px 12px; font: inherit; font-size: 15px; font-weight: 800; line-height: 1.15; color: #fff; background: #2B2536; border: 1.5px solid #2B2536; border-radius: 16px; cursor: pointer">Escuchar la canción</button>
    <button onClick="{{ save }}" style="min-height: 56px; padding: 10px 12px; font: inherit; font-size: 15px; font-weight: 800; line-height: 1.15; color: #2B2536; background: #fff; border: 1.5px solid rgba(43,37,54,.25); border-radius: 16px; cursor: pointer">Guardar el recuerdo</button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  NN = { do3: 48, re3: 50, mi3: 52, sol3: 55, la3: 57, do4: 60, re4: 62, mi4: 64, sol4: 67, la4: 69, do5: 72 };
  PH = [['do4','re4','mi4','sol4'], ['sol4','mi4','re4','do4'], ['mi4','sol4','la4','sol4'], ['do5','la4','sol4','mi4'], ['re4','mi4','sol4','la4'], ['la4','sol4','mi4','re4'], ['do4','mi4','sol4','do5']];
  traj() {
    if (this._t) return this._t;
    const cl = v => Math.round(Math.max(-6, Math.min(6, v)) * 10) / 10, err = .7, out = [];
    for (let i = 0; i < 700; i++) { const s = i * .1, ax = 3.6 * Math.sin(s * 1.05), ay = 4.4 * Math.sin(s * 1.6 + .5); out.push([ax, ay, ax * .9 + err * Math.sin(s * .83 + 1), ay + err * Math.cos(s * .71)].map(cl)); }
    return (this._t = out);
  }
  pts(ix, iy) { const step = Math.max(1, Math.ceil(700 / 300)); return this.traj().filter((_, i) => i % step === 0).map(p => p[ix] + ',' + (-p[iy])).join(' '); }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  tone(ac, f, gain, dur, t, glock) {
    const parts = glock ? [[1, 1, 1], [2.76, .22, .7], [5.4, .07, .4]] : [[1, 1, 1]];
    parts.forEach(([r, a, d]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f * r;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, gain * a), t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur * d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur * d + .05);
    });
  }
  play() {
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ac = this.ac || new C(); this.ac.resume();
      const ac = this.ac, t0 = ac.currentTime + .1, step = .3; let k = 0;
      this.PH.forEach(ph => { this.tone(ac, this.hz(this.NN[ph[0]] - 12), .12, 2.4, t0 + k * step, false); ph.forEach(n => { this.tone(ac, this.hz(this.NN[n]), .13, 2, t0 + k * step, true); k++; }); });
    } catch (e) {}
  }
  saveSvg() {
    try {
      let grid = ''; for (let i = -6; i <= 6; i += 2) grid += '<line x1="' + i + '" y1="-6" x2="' + i + '" y2="6" stroke="#EFECE4" stroke-width=".05"/><line x1="-6" y1="' + i + '" x2="6" y2="' + i + '" stroke="#EFECE4" stroke-width=".05"/>';
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6.6 -6.6 13.2 13.2"><rect x="-6.6" y="-6.6" width="13.2" height="13.2" rx="1" fill="#fff"/>' + grid + '<polyline points="' + this.pts(0, 1) + '" fill="none" stroke="#9F8AD9" stroke-width=".16" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/><polyline points="' + this.pts(2, 3) + '" fill="none" stroke="#E85E45" stroke-width=".11" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/></svg>';
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      const a = document.createElement('a'); a.href = url; a.download = 'balancin-recuerdo.svg'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {}
  }
  renderVals() {
    return { ptsA: this.pts(0, 1), ptsC: this.pts(2, 3), listen: () => this.play(), save: () => this.saveSvg() };
  }
}
</script>
</body>
</html>
