<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Preparación 4 · Quién usa cada stick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B35B8}a:hover{color:#2B2536}
.kid{animation:kin .5s ease-out .1s both, kmv 1s cubic-bezier(.4,0,.2,1) 1.5s both}
.par{animation:pmv 1s cubic-bezier(.4,0,.2,1) 1.5s both}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) .8s both}
.ptag{animation:tag .45s ease-out 2.6s both}
@keyframes kin{from{opacity:0}to{opacity:1}}
@keyframes kmv{from{transform:translateX(0)}to{transform:translateX(66px)}}
@keyframes pmv{from{transform:translateX(0)}to{transform:translateX(-66px)}}
@keyframes rise{from{opacity:0;transform:translateY(46px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tag{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cover{animation:cover .6s cubic-bezier(.65,0,.35,1) both}
@keyframes cover{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@media(prefers-reduced-motion:reduce){.cover{animation:none;transform:translate(-50%,-50%)}.kid{animation:none;transform:translateX(66px)}.par{animation:none;transform:translateX(-66px)}.rise,.ptag{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 66px 18px 20px; background: #EFECE4; color: #2B2536; font-family: Nunito, ui-rounded, 'Segoe UI', system-ui, sans-serif; line-height: 1.35; display: flex; flex-direction: column; gap: 14px">
  <a href="Prep4.dc.html" style="position: absolute; top: 14px; left: 14px; height: 40px; box-sizing: border-box; padding: 0 14px 0 12px; border-radius: 999px; background: #fff; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: #2B2536; text-decoration: none; box-shadow: 0 2px 10px rgba(43,37,54,.1)"><span style="width: 8px; height: 8px; border-left: 2.5px solid #2B2536; border-bottom: 2.5px solid #2B2536; transform: translateX(2px) rotate(45deg)"></span>Atrás</a>
  <ol aria-label="Paso 4 de 4" style="list-style: none; margin: 0; padding: 0; flex: none; display: flex; align-items: center; justify-content: center">
    <li aria-label="Paso 1, completado" style="box-sizing: border-box; flex: none; width: 34px; height: 34px; min-width: 34px; min-height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 900; line-height: 1; background: #0D9488"><svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px; display: block"><path d="M5 10.5 L8.5 14 L15 7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></li>
    <li aria-hidden="true" style="flex: none; width: 32px; height: 4px; background: #0D9488"></li>
    <li aria-label="Paso 2, completado" style="box-sizing: border-box; flex: none; width: 34px; height: 34px; min-width: 34px; min-height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 900; line-height: 1; background: #0D9488"><svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px; display: block"><path d="M5 10.5 L8.5 14 L15 7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></li>
    <li aria-hidden="true" style="flex: none; width: 32px; height: 4px; background: #0D9488"></li>
    <li aria-label="Paso 3, completado" style="box-sizing: border-box; flex: none; width: 34px; height: 34px; min-width: 34px; min-height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 900; line-height: 1; background: #0D9488"><svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px; display: block"><path d="M5 10.5 L8.5 14 L15 7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></li>
    <li aria-hidden="true" style="flex: none; width: 32px; height: 4px; background: #0D9488"></li>
    <li aria-current="step" style="box-sizing: border-box; flex: none; width: 34px; height: 34px; min-width: 34px; min-height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 900; line-height: 1; background: #fff; border: 3px solid #0D9488; color: #0D9488">4</li>
  </ol>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
    <div style="flex: 1; min-height: 250px; display: grid; place-items: center; overflow: hidden">
      <div role="img" aria-label="El stick naranjo del niño y el stick lila del padre, uno al lado del otro" style="position: relative; width: 300px; height: 290px">
        <div class="par" style="position: absolute; left: 90px; bottom: 0; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 1">
          <div class="rise" style="position: relative; width: 54px; height: 216px; border-radius: 27px; background: #B3A2DC">
            <span style="position: absolute; left: 12px; top: 12px; width: 30px; height: 30px; border-radius: 50%; background: rgba(242,228,74,.45)"></span>
            <span style="position: absolute; left: 18px; top: 18px; width: 18px; height: 18px; border-radius: 50%; background: #F2E44A"></span>
          </div>
          <span class="ptag" style="padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; background: #B3A2DC">Stick del padre</span>
        </div>
        <div class="kid" style="position: absolute; left: 90px; bottom: 0; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 2">
          <div style="position: relative; width: 42px; height: 135px; border-radius: 21px; background: #E85E45">
            <span style="position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(242,228,74,.45)"></span>
            <span style="position: absolute; left: 13.5px; top: 13.5px; width: 15px; height: 15px; border-radius: 50%; background: #F2E44A"></span>
          </div>
          <span style="padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; background: #F4C3B6">Stick del niño</span>
        </div>
      </div>
    </div>
    <div style="text-align: center">
      <h2 style="margin: 0 0 8px; font-size: 26px; font-weight: 900; letter-spacing: -.01em; line-height: 1.1">El stick pequeño es del <span style="color: rgb(232, 94, 69)">niño,</span>&nbsp;el grande, del <span style="color: rgb(179, 162, 220)">adulto</span></h2>
      <p style="margin: 0; font-size: 15px; color: #4a445a">Cada stick se ajusta al gesto de quien lo usa: un gesto pequeño del adulto llega tan lejos como uno amplio del niño.</p>
    </div>
    <button onClick="{{ start }}" style="box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; padding: 12px 20px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; color: #fff; text-decoration: none; background: #2B2536; border: 1.5px solid #2B2536; border-radius: 16px">Comenzar</button>
    <a href="Bienvenida.dc.html" ref="{{ setNext }}" aria-hidden="true" tabindex="-1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none">Siguiente</a>
  </div>
  <sc-if value="{{ covering }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; inset: 0; z-index: 10; overflow: hidden"><span class="cover" style="position: absolute; left: 50%; top: 50%; width: 960px; height: 960px; border-radius: 50%; background: #EFECE4; box-shadow: 0 0 48px rgba(43,37,54,.22)"></span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { covering: false };
  goNext() {
    const el = this.nextEl; if (!el) return;
    try { el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window })); } catch (e) { try { el.click(); } catch (x) {} }
  }
  componentWillUnmount() { clearTimeout(this.nx); }
  renderVals() {
    return {
      covering: this.state.covering,
      start: () => {
        if (this.state.covering) return;
        this.setState({ covering: true });
        this.nx = setTimeout(() => this.goNext(), 650);
      },
      setNext: el => { this.nextEl = el; }
    };
  }
}
</script>
</body>
</html>
